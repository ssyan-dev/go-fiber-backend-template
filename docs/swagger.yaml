basePath: /api/v1
definitions:
  handler.adminUpdateUserReq:
    properties:
      avatar_url:
        example: https://example.com/avatar.png
        type: string
      email:
        example: admin@example.com
        type: string
      is_banned:
        example: false
        type: boolean
      is_email_verified:
        example: true
        type: boolean
      password:
        example: newpassword123
        minLength: 6
        type: string
      role:
        allOf:
        - $ref: '#/definitions/models.UserRole'
        enum:
        - default
        - admin
        example: admin
    type: object
  handler.forgotPasswordReq:
    properties:
      email:
        example: user@example.com
        type: string
    required:
    - email
    type: object
  handler.loginReq:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: password123
        type: string
    required:
    - email
    - password
    type: object
  handler.registerReq:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: password123
        minLength: 6
        type: string
      passwordConfirm:
        example: password123
        minLength: 6
        type: string
    required:
    - email
    - password
    - passwordConfirm
    type: object
  handler.resendEmailVerificationReq:
    properties:
      email:
        example: user@example.com
        type: string
    required:
    - email
    type: object
  handler.resetPasswordReq:
    properties:
      code:
        example: "123456"
        type: string
      password:
        example: newpassword123
        minLength: 6
        type: string
      passwordConfirm:
        example: newpassword123
        minLength: 6
        type: string
    required:
    - code
    - password
    - passwordConfirm
    type: object
  handler.updateUserReq:
    properties:
      avatar_url:
        example: https://example.com/avatar.png
        type: string
      current_password:
        example: oldpassword123
        minLength: 6
        type: string
      email:
        example: newemail@example.com
        type: string
      new_password:
        example: newpassword123
        minLength: 6
        type: string
    type: object
  models.PaginatedUsersResponse:
    properties:
      meta:
        $ref: '#/definitions/models.PaginationMeta'
      users:
        items:
          $ref: '#/definitions/models.User'
        type: array
    type: object
  models.PaginationMeta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  models.Session:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      ip:
        type: string
      is_blocked:
        type: boolean
      user_agent:
        type: string
      user_id:
        type: string
    type: object
  models.User:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_banned:
        type: boolean
      is_email_verified:
        type: boolean
      role:
        $ref: '#/definitions/models.UserRole'
      updated_at:
        type: string
    type: object
  models.UserRole:
    enum:
    - default
    - admin
    type: string
    x-enum-varnames:
    - RoleDefault
    - RoleAdmin
  response.ErrorResponse:
    properties:
      message:
        example: error description
        type: string
      success:
        example: false
        type: boolean
    type: object
  response.HealthData:
    properties:
      env:
        example: development
        type: string
      services:
        additionalProperties:
          type: string
        type: object
      status:
        example: ok
        type: string
      timestamp:
        example: "2026-10-03T18:00:00Z"
        type: string
    type: object
  response.HealthResponse:
    properties:
      data:
        $ref: '#/definitions/response.HealthData'
      message:
        example: server is healthy
        type: string
      success:
        example: true
        type: boolean
    type: object
  response.SuccessResponse:
    properties:
      message:
        example: operation successful
        type: string
      success:
        example: true
        type: boolean
    type: object
  response.TokenData:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
    type: object
  response.TokenResponse:
    properties:
      data:
        $ref: '#/definitions/response.TokenData'
      message:
        example: login successful
        type: string
      success:
        example: true
        type: boolean
    type: object
  response.UserResponse:
    properties:
      data: {}
      message:
        example: success
        type: string
      success:
        example: true
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    name: Stanislav Simakhin
    url: https://ssyan.ru
  description: Backend API
  title: Backend API
  version: "1.0"
paths:
  /admin/users:
    get:
      consumes:
      - application/json
      description: Get a paginated list of users with optional filters by search,
        role, and ban status. Requires admin role
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        minimum: 1
        name: page
        type: integer
      - description: 'Items per page (default: 10)'
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Search by email
        in: query
        name: search
        type: string
      - description: Filter by role
        enum:
        - default
        - admin
        in: query
        name: role
        type: string
      - description: Filter by ban status
        in: query
        name: is_banned
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.UserResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.PaginatedUsersResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all users
      tags:
      - admin-users
  /admin/users/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a user by their UUID. Admins cannot delete themselves. Requires
        admin role
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Cannot delete yourself
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - admin-users
    get:
      consumes:
      - application/json
      description: Get a specific user by their UUID. Requires admin role
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.UserResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Invalid user ID
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - admin-users
    patch:
      consumes:
      - application/json
      description: Update a user's profile by their UUID. Admins cannot demote or
        ban themselves. Requires admin role
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Update user request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.adminUpdateUserReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.UserResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Cannot demote/ban yourself or invalid input
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Email already taken
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user
      tags:
      - admin-users
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Send a password reset code to the specified email address
      parameters:
      - description: Forgot password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.forgotPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Forgot password
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user by email and password. Returns access token in
        body, sets refresh token as HTTP-only cookie
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.loginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TokenResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Login user
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke current session and clear refresh token cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Logout user
      tags:
      - auth
  /auth/oauth/{provider}:
    get:
      description: Get redirect URL for the specified OAuth provider (google, yandex,
        github). Redirects to the provider's authorization page
      parameters:
      - description: OAuth provider
        enum:
        - google
        - yandex
        - github
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Found
        "400":
          description: Unsupported provider
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get OAuth URL
      tags:
      - auth
  /auth/oauth/{provider}/callback:
    get:
      description: Handle OAuth provider callback after user authorization. Returns
        access token in body, sets refresh token as HTTP-only cookie
      parameters:
      - description: OAuth provider
        enum:
        - google
        - yandex
        - github
        in: path
        name: provider
        required: true
        type: string
      - description: OAuth authorization code
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TokenResponse'
        "400":
          description: Code is required
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: OAuth Callback
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Issue new access and refresh tokens using the refresh token from
        HTTP-only cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TokenResponse'
        "401":
          description: Refresh token not found or invalid
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Refresh JWT tokens
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with email and password. A verification
        email will be sent if SMTP enabled and configured
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.registerReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.UserResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Passwords don't match
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: User already exists
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Register new user
      tags:
      - auth
  /auth/resend-email-verification:
    post:
      consumes:
      - application/json
      description: Resend a new verification code to the specified email address
      parameters:
      - description: Resend verification request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.resendEmailVerificationReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Email already verified
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Resend email verification code
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset user password using a verification code sent via email
      parameters:
      - description: Reset password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.resetPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Passwords don't match or invalid code
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Reset password
      tags:
      - auth
  /auth/sessions:
    delete:
      consumes:
      - application/json
      description: Delete all active sessions of the authenticated user. This will
        revoke all tokens
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete all sessions
      tags:
      - sessions
    get:
      consumes:
      - application/json
      description: Get all active sessions of the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.UserResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Session'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get active sessions
      tags:
      - sessions
  /auth/sessions/{sessionId}:
    delete:
      consumes:
      - application/json
      description: Delete a specific session by its ID. This will immediately revoke
        the session
      parameters:
      - description: Session ID (UUID)
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete session
      tags:
      - sessions
  /auth/sessions/{sessionId}/block:
    patch:
      consumes:
      - application/json
      description: Block a specific session by its ID. The blocked session's tokens
        will be invalidated
      parameters:
      - description: Session ID (UUID)
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Block session
      tags:
      - sessions
  /auth/verify-email:
    get:
      description: Verify email address using a verification code passed as a query
        parameter
      parameters:
      - description: Verification code
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Code is required or invalid
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Verify email
      tags:
      - auth
  /health:
    get:
      description: Check if the server, postgresql and redis is healthy
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.HealthResponse'
      summary: Health check
      tags:
      - system
  /users/me:
    get:
      consumes:
      - application/json
      description: Get the authenticated user's profile information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.UserResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Update the authenticated user's profile
      parameters:
      - description: Update profile request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.updateUserReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Invalid current password or password required
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update current user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Bearer [JWT]
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
